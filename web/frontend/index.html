<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 空 favicon：消除浏览器默认 /favicon.ico 请求的控制台 404 噪声；
         真实图标属新视觉决策，留待设计规范定稿后另行添加 -->
    <link rel="icon" href="data:," />
    <title>Gaussian 16 管理工作台</title>
    <!-- 字体由 fontsource 构建期自托管（main.ts 内 import），不再引入 Google Fonts CDN -->
    <script>
      // 主题首帧预设（m0-frontend-design §3）：默认亮色，localStorage 记忆。
      // 在 CSS 解析前同步执行，刷新时直接落上次主题，不闪暗色。
      document.documentElement.dataset.theme =
        localStorage.getItem("g16web-theme") === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
