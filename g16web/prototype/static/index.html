<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G16 Web 控制台</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b22; --panel2:#1d232c; --line:#2a3140;
  --fg:#dbe2ee; --dim:#8b95a7; --acc:#4da3ff; --ok:#3ecf8e; --warn:#f5b455;
  --err:#f2707a; --run:#9d7bff; --mono:'Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,'Segoe UI','Microsoft YaHei',sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
header h1 span{color:var(--acc)}
.pills{display:flex;gap:8px;margin-left:auto}
.pill{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--dim);background:var(--panel2)}
.pill b{color:var(--fg);font-weight:600}
.pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--dim)}
.pill.on .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{background:none;border:none;color:var(--dim);padding:8px 16px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
nav button.active{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:20px;max-width:1200px;margin:0 auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{font-size:12px;color:var(--dim);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
tr.job{cursor:pointer}
tr.job:hover{background:var(--panel2)}
tr.sel{background:#203045!important}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
.b-RUNNING{background:#241f3d;color:var(--run)}
.b-WAITING{background:#3a2f1c;color:var(--warn)}
.b-FINISHED{background:#173226;color:var(--ok)}
.b-FAILED,.b-CANCELED,.b-ABORTED{background:#3a2023;color:var(--err)}
.bar{height:6px;background:var(--panel2);border-radius:4px;min-width:110px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:4px;transition:width .6s}
.bar>i.indet{width:40%!important;animation:slide 1.2s infinite linear}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--dim)}
#detail{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:none}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:130px}
.card .k{font-size:11px;color:var(--dim)}
.card .v{font-size:16px;font-weight:600;margin-top:2px}
.card .v small{font-size:11px;color:var(--dim);font-weight:400}
#logbox{background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:500}
input[type=text],select,textarea{background:#0b0e12;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 10px;font-size:13px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;resize:vertical}
.warncard{background:#332a18;border:1px solid #5a4720;color:#f0c987;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px}
.okcard{background:#173226;border:1px solid #1f5140;color:#9fe8c6;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px}
.prev{background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.prev .c{color:var(--acc)}
.prev .l0{color:#c792ea}
.prev .t{color:var(--dim);font-style:italic}
#filelist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:8px}
#filelist div{padding:5px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between}
#filelist div:hover{background:var(--panel2)}
#filelist .f{color:var(--dim)}
.crumb{font-size:12px;color:var(--dim);margin-top:8px;word-break:break-all}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);border:1px solid var(--acc);padding:10px 18px;border-radius:8px;display:none;z-index:9}
label{font-size:12px;color:var(--dim)}
.hint{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>G16 <span>Web</span> 控制台</h1>
  <div class="pills">
    <span class="pill" id="pill-server"><span class="dot"></span>server</span>
    <span class="pill" id="pill-worker"><span class="dot"></span>worker</span>
  </div>
</header>
<nav>
  <button id="tab-jobs" class="active" onclick="showTab('jobs')">任务队列</button>
  <button id="tab-submit" onclick="showTab('submit')">提交任务</button>
</nav>
<main>
  <!-- 队列 -->
  <div id="view-jobs">
    <table>
      <thead><tr><th style="width:50px">ID</th><th>名称</th><th style="width:90px">状态</th>
        <th style="width:150px">进度</th><th>最新能量 (Ha)</th><th style="width:110px">耗时</th><th style="width:70px">操作</th></tr></thead>
      <tbody id="jobs"><tr><td colspan="7" class="dim">加载中…</td></tr></tbody>
    </table>
    <div id="detail">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h3 style="margin:0" id="d-title"></h3>
        <div>
          <button class="btn danger" onclick="cancelJob()">取消任务</button>
          <button class="btn" onclick="closeDetail()">关闭</button>
        </div>
      </div>
      <div class="cards" id="d-cards" style="margin-top:12px"></div>
      <div class="hint" id="d-paths" style="margin-bottom:8px"></div>
      <div id="logbox" class="mono">…</div>
    </div>
  </div>

  <!-- 提交 -->
  <div id="view-submit" style="display:none">
    <div class="grid2">
      <div class="panel">
        <h3>① 选择输入文件</h3>
        <label>方式 A：服务器路径（可填 /mnt/c/... 直接用 Windows 里的文件）</label>
        <div class="row" style="margin-top:6px">
          <input type="text" id="in-path" placeholder="/home/keepoux/scratch/demo/water_sp.gjf">
          <button class="btn" onclick="browse()">浏览</button>
          <button class="btn" onclick="doPreview('path')">预览</button>
        </div>
        <div id="filelist" style="display:none"></div>
        <div class="crumb" id="filecrumb"></div>
        <hr style="border-color:var(--line);border-style:solid;border-width:1px 0 0;margin:14px 0">
        <label>方式 B：上传 / 粘贴内容</label>
        <div class="row" style="margin-top:6px">
          <input type="file" id="in-file" accept=".gjf,.com,.in,.txt" style="color:var(--dim)">
          <input type="text" id="in-name" placeholder="保存文件名，如 mol.gjf" style="width:200px">
        </div>
        <textarea id="in-content" rows="10" style="margin-top:8px" placeholder="或直接粘贴 Gaussian 输入内容…"></textarea>
      </div>
      <div class="panel">
        <h3>② 预览</h3>
        <div id="preview"><div class="hint">选择或粘贴文件后点「预览」</div></div>
        <div class="row" style="margin-top:12px;align-items:center">
          <label>并发槽</label>
          <select id="in-slots" style="width:70px"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>6</option></select>
          <span class="hint">同时运行的任务数（单任务核数看 %NProcShared）</span>
          <button class="btn acc" id="btn-submit" style="margin-left:auto" onclick="doSubmit()" disabled>提交到队列</button>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let selected=null, pollTimer=null, detailTimer=null, lastLogLen=0;
let pendPreview=null; // {path} 或 {content,filename}

function showTab(t){
  $('view-jobs').style.display = t==='jobs'?'':'none';
  $('view-submit').style.display = t==='submit'?'':'none';
  $('tab-jobs').classList.toggle('active',t==='jobs');
  $('tab-submit').classList.toggle('active',t==='submit');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600);
}
async function api(path,opts){
  const r=await fetch(path,opts);
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
function fmtTime(s){
  if(s==null)return'—';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.round(s%60);
  return h?`${h}时${m}分`:m?`${m}分${sec}秒`:`${sec}秒`;
}
function fmtE(e){return e==null?'—':e.toFixed(8);}

/* ---- 状态 ---- */
async function pollStatus(){
  try{
    const s=await api('/api/status');
    $('pill-server').className='pill'+(s.server?' on':'');
    $('pill-server').innerHTML=`<span class="dot"></span>server <b>${s.server?'在线':'离线'}</b>`;
    const on=s.workers.filter(w=>w.online);
    const cpus=on.reduce((a,w)=>a+(w.cpus||0),0);
    $('pill-worker').className='pill'+(on.length?' on':'');
    $('pill-worker').innerHTML=`<span class="dot"></span>worker <b>${on.length?on.length+' 在线 / '+cpus+' CPU':'离线'}</b>`;
  }catch(e){}
}

/* ---- 队列 ---- */
function badge(st){return `<span class="badge b-${st}">${st}</span>`;}
function progressBar(p){
  if(!p)return'<div class="bar"><i class="indet"></i></div>';
  if(p.normal_termination)return'<div class="bar"><i style="width:100%"></i></div>';
  if(p.error_termination)return'<div class="bar"><i style="width:100%;background:var(--err)"></i></div>';
  if(p.opt_step&&p.nsteps)return`<div class="bar"><i style="width:${Math.min(100,p.opt_step/p.nsteps*100)}%"></i></div>`;
  return'<div class="bar"><i class="indet"></i></div>';
}
async function pollJobs(){
  try{
    const jobs=await api('/api/jobs');
    $('jobs').innerHTML = jobs.length?'':'<tr><td colspan="7" class="dim">队列为空 — 去「提交任务」扔一个进去吧</td></tr>';
    for(const j of jobs){
      const p=j.progress||{};
      const tr=document.createElement('tr');
      tr.className='job'+(selected===j.id?' sel':'');
      tr.onclick=()=>openJob(j.id);
      tr.innerHTML=`<td class="mono">${j.id}</td><td>${j.name}</td><td>${badge(j.state)}</td>
        <td>${progressBar(p)}<div class="hint">${p.summary||''}</div></td>
        <td class="mono">${fmtE(p.last_energy)}</td>
        <td class="dim">${fmtTime(p.elapsed)}</td>
        <td>${j.state==='RUNNING'||j.state==='WAITING'?`<button class="btn danger" style="padding:2px 8px" onclick="event.stopPropagation();cancelJob(${j.id})">取消</button>`:''}</td>`;
      $('jobs').appendChild(tr);
      if(selected===j.id) refreshDetail(p);
    }
  }catch(e){}
}
function openJob(id){
  selected=id; $('detail').style.display='block';
  $('logbox').textContent='…';
  refreshDetail(); refreshLog(true);
  clearInterval(detailTimer);
  detailTimer=setInterval(()=>{refreshLog(false);},2000);
}
function closeDetail(){selected=null;$('detail').style.display='none';clearInterval(detailTimer);}
async function refreshDetail(p){
  if(!selected)return;
  if(!p){try{p=await api('/api/job/'+selected);}catch(e){return;}}
  $('d-title').textContent=`任务 ${selected} — ${p.summary||p.state||''}`;
  const cards=[
    ['状态',p.state],['优化步',p.opt_step?p.opt_step+(p.nsteps?'/'+p.nsteps:''):'—'],
    ['SCF 圈数',p.scf_cycles??'—'],['最新能量',p.last_energy!=null?p.last_energy.toFixed(8)+(p.energy_method?` <small>${p.energy_method}</small>`:''):'—'],
    ['SCF 迭代中',p.current_scf_iter?p.current_scf_iter+' 圈':'—'],['CPU 时间',p.cpu_time||'—'],
    ['耗时',fmtTime(p.elapsed)]];
  $('d-cards').innerHTML=cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
  $('d-paths').innerHTML=`输入: <span class="mono">${p.input||'?'}</span>　日志: <span class="mono">${p.log||'?'}</span>`;
}
async function refreshLog(scroll){
  if(!selected)return;
  try{
    const d=await api(`/api/job/${selected}/log?lines=250`);
    const box=$('logbox');
    if(d.text==null){box.textContent='日志尚未生成';return;}
    if(d.text.length!==lastLogLen){
      box.textContent=d.text; lastLogLen=d.text.length;
      if(scroll!==false) box.scrollTop=box.scrollHeight;
    }
  }catch(e){}
}
async function cancelJob(id){
  id=id||selected; if(!id)return;
  if(!confirm('取消任务 '+id+' ?'))return;
  await api(`/api/job/${id}/cancel`,{method:'POST'});
  toast('已取消'); if(id===selected)refreshDetail();
}

/* ---- 提交 ---- */
let browseDir=null;
async function browse(){
  const list=$('filelist');
  if(list.style.display==='none'){
    list.style.display=''; await loadDir(browseDir||'~');
  } else list.style.display='none';
}
async function loadDir(path){
  try{
    const d=await api('/api/files?path='+encodeURIComponent(path));
    browseDir=d.path;
    $('filecrumb').textContent=d.path;
    let html=d.parent?`<div onclick="loadDir('${encodeURIComponent(d.parent)}')">⬆ ..</div>`:'';
    for(const e of d.entries){
      if(e.dir) html+=`<div onclick="loadDir('${encodeURIComponent(d.path+'/'+e.name)}')">📁 ${e.name}</div>`;
      else{
        const ext=e.name.split('.').pop();
        const mark=['gjf','com','in'].includes(ext)?'🧪':'📄';
        html+=`<div onclick="pickFile('${encodeURIComponent(d.path+'/'+e.name)}')"><span>${mark} ${e.name}</span><span class="f">${e.size!=null?(e.size/1024).toFixed(1)+'K':''}</span></div>`;
      }
    }
    list.innerHTML=html;
  }catch(e){toast(e.message);}
}
async function pickFile(enc){
  const p=decodeURIComponent(enc);
  $('in-path').value=p;
  $('filelist').style.display='none';
  await doPreview('path');
}
function collectInput(){
  const path=$('in-path').value.trim();
  if(path)return{path};
  const content=$('in-content').value;
  if(content.trim())return{content,filename:$('in-name').value.trim()||'pasted.gjf'};
  throw new Error('请先选择路径或粘贴内容');
}
async function doPreview(mode){
  try{
    const body=mode==='path'?{path:$('in-path').value.trim()}:collectInput();
    const r=await api('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    pendPreview=body; renderPreview(r);
  }catch(e){toast(e.message);}
}
function renderPreview(r){
  let html='';
  for(const w of r.warnings) html+=`<div class="warncard">⚠ ${w}</div>`;
  if(r.valid) html+=`<div class="okcard">✓ 输入有效，共 ${r.njobs} 个任务</div>`;
  r.jobs.forEach((j,i)=>{
    const geo = j.format==='cartesian'
      ? j.atoms.slice(0,12).map(a=>a.symbol.padEnd(3)+a.xyz.map(x=>x.toFixed(6).padStart(14)).join('')).join('\n')
      : j.zmat.join('\n');
    html+=`<div class="hint" style="margin:10px 0 4px">任务 ${i+1}（${j.format==='zmatrix'?'Z-矩阵':'直角坐标'}，${j.natoms} 个原子）</div>
      <div class="prev"><span class="l0">${j.link0.map(d=>'%'+d.key+'='+d.value).join('\n')}</span>\n<span class="c">${j.route}</span>\n<span class="t">${j.title}</span>\n${j.charge!=null?j.charge+' '+j.mult:''}\n${geo}${j.natoms>12&&j.format==='cartesian'?'\n… 共 '+j.natoms+' 个原子':''}</div>`;
  });
  $('preview').innerHTML=html;
  $('btn-submit').disabled=!r.valid;
}
async function doSubmit(){
  if(!pendPreview){toast('请先预览');return;}
  const body={...pendPreview,slots:+$('in-slots').value};
  if(body.content){
    const edited=$('in-content').value;
    if(edited.trim())body.content=edited;   // 以编辑器当前内容为准
  }
  try{
    const r=await api('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast(`已提交 #${r.job_id} (${r.name})`);
    pendPreview=null; $('btn-submit').disabled=true;
    showTab('jobs'); selected=r.job_id; openJob(r.job_id);
  }catch(e){toast(e.message);}
}
$('in-file').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; if(!f)return;
  $('in-content').value=await f.text();
  if(!$('in-name').value)$('in-name').value=f.name;
  pendPreview={content:$('in-content').value,filename:$('in-name').value};
  doPreview();
});

pollStatus(); pollJobs(); setInterval(pollStatus,5000); setInterval(pollJobs,2000);
</script>
</body>
</html>
