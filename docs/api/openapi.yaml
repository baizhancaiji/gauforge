            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'

  /history/{id}/archive:
    post:
      tags: [history]
      operationId: archiveHistoryEntry
      summary: 归档（唯一冻结后可变操作）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '204':
          description: 已归档
        '404':
          $ref: '#/components/responses/Error'

  /history/{id}/requeue:
    post:
      tags: [history]
      operationId: requeueHistoryEntry
      summary: 重新排队（原样重跑；满员 409，M1 实施）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 已入待执行队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /history/{id}/return-candidate:
    post:
      tags: [history]
      operationId: returnCandidate
      summary: 退回候选（新 id、带来源标记，M1 实施）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '201':
          description: 新候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '404':
          $ref: '#/components/responses/Error'

  /history/cleanup:
    post:
      tags: [history]
      operationId: cleanupTransients
      summary: 手动触发过期 chk/rwf 清理（返回清理统计，M1 实施）
      responses:
        '200':
          description: 清理统计
          content:
            application/json:
              schema:
                type: object
                required: [checked, removed_chk, removed_rwf]
                properties:
                  checked:
                    type: integer
                  removed_chk:
                    type: integer
                  removed_rwf:
                    type: integer

  /history/export:
    post:
      tags: [history]
      operationId: exportHistoryOutputs
      summary: 批量导出选中条目的输出文件（ZIP；逐条 .out 命名）
      description: |
        按执行 id 集合打包 run/<id>/input.log（G16 输出）为 ZIP 下载：
        条目内命名 <任务stem>.out（正规输出扩展），同一任务多次执行产生
        同名冲突时全部改用「三位补零执行 id-<stem>.out」前缀区分；
        无输出文件的条目（skipped/输出已缺）跳过并在包内 _导出说明.txt
        逐条登记，选中条目全部无输出时 404。响应
        Content-Disposition: attachment; filename=gauforge-outputs-<时刻>.zip。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryExportRequest'
      responses:
        '200':
          description: 输出文件 ZIP 包
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  # ---------------- 分析域端点（M3 波 A1 增补；全部只读或幂等派生） ----------------
  /history/{id}/analysis:
    get:
      tags: [history]
      operationId: getAnalysisOverview
      summary: Result 概览（读 analysis.json；非 succeeded 或缺失且重建失败 409，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Result 全集（含 degraded）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /history/{id}/analysis/convergence:
    get:
      tags: [history]
      operationId: getAnalysisConvergence
      summary: SCF 迹线+几何收敛+能量序列（块缺失 422 ANALYSIS_PARSE_FAILED，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 收敛数据（hartree/eV 双单位）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvergenceResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /history/{id}/analysis/frequencies:
    get:
      tags: [history]
      operationId: getAnalysisFrequencies
      summary: 频率表与红外强度（无频率任务 422 ANALYSIS_PARSE_FAILED，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 频率表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequenciesResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /history/{id}/analysis/orbitals:
    get:
      tags: [history]
      operationId: getAnalysisOrbitals
      summary: 轨道能量清单（无 MO 表 422 ANALYSIS_PARSE_FAILED，建议 Pop=Reg/Full，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 轨道清单（不含系数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbitalsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /history/{id}/analysis/cube:
    post:
      tags: [history]
      operationId: generateCube
      summary: 生成 cube（幂等：同参数返回既有 cube_id；白名单/上界越界 422，
        生成失败 502、cubegen 缺失 503，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubeRequest'
      responses:
        '200':
          description: cube 标识
          content:
            application/json:
              schema:
                type: object
                required: [cube_id]
                properties:
                  cube_id:
                    type: string
                    description: 参数摘要哈希；产物落 run/<id>/cubes/<cube_id>.cube
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /history/{id}/analysis/cube/{cube_id}:
    get:
      tags: [history]
      operationId: downloadCube
      summary: cube 文件流（chemical/x-cube；前端 3Dmol 直接 fetch，M3）
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - name: cube_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: cube 文件流
          content:
            chemical/x-cube:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /analysis/workspace-out:
    post:
      tags: [history]
      operationId: analyzeWorkspaceOut
      summary: 工作区 .out/.log 只读分析（一次性四块合一；路径守卫失败
        （越界/空路径/后缀不符）400、缺失 404、不可解析/超时 422；不落库，M3）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: 工作区内相对路径（后缀 ∈ {.out,.log}）
      responses:
        '200':
          description: 四块合一负载
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceOutAnalysis'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storage/usage:
    get:
      tags: [storage]
      operationId: getStorageUsage
      summary: 空间占用统计与阈值告警（M3.7，只读；entries 降序截断前 50 条）
      responses:
        '200':
          description: 占用统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUsage'

  /events:
    get:
      tags: [system]
      operationId: sseEvents
      summary: SSE 事件流（契约见 sse.md）
      responses:
        '200':
          description: SSE 流
          headers:
            Content-Type:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string