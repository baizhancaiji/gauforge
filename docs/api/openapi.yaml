# G16 Web 工作台 · REST API 契约（M0）
#
# 本文件是项目 API 的唯一事实来源（SSOT）。变更一律走文档 diff（roadmap §4）。
# 设计依据：docs/plans/m0-plan.md §2；领域对象字段集对照 roadmap §2.1/§2.6。
# 版本：OpenAPI 3.0.3（决策点 7：为保全 datamodel-code-generator / openapi-core
#       兼容性选用；契约语义不受版本影响）。
#
# 公共约定（m0-plan §2.1）：
#   - 路径前缀 /api/v1；资源名复数 kebab-case（pending 固定单数）。
#   - 时间 ISO 8601 带时区偏移、秒级；耗时带 `_s` 后缀。
#   - task/candidate id 自增正整数；queue id 随机 6 位 base32；execution id 自增正整数。
#   - 空值显式 null（timestamp 类可选字段按 schema 标注）。
#   - 分页信封 {"items":[],"page":1,"page_size":50,"total":123}，offset 式。
#   - 错误结构统一 {"error":{"code","message","details"}}，code 为 SCREAMING_SNAKE_CASE 枚举。
#
# 错误码全集（29 码，SSOT 载体；M2 A4 定稿 19 码 + 版本更新功能 v2.1.0 增补 5 码
# + M3 波 A1 增补分析/存储域 5 码。m0-plan §2.1.1 为历史原稿不再现行）：
#   ErrorBody.code 取值以本清单为准，实现集合 ⊆ 清单（test_error_codes.py 静态闸门）。
#   - INVALID_REQUEST — 400：请求形态错误（路径/参数级，如 molecule 节或未知节名编辑）
#   - NOT_FOUND — 404：资源不存在
#   - VALIDATION_FAILED — 422：请求体校验失败（含 member_ids 成员增补/重复、
#     导入 mode=files + queue_from_folder=true 组合、folder_name 缺失等）
#   - INTERNAL_ERROR — 500：服务器内部错误（message 不泄露内部细节）
#   - QUEUE_MEMBER_RANGE — 422：创建队列成员数不在 2–10（创建期专用）
#   - QUEUE_STATE_CONFLICT — 409：队列属性/成员操作与队列状态机冲突（非
#     unsubmitted 改名/开关、submitted/executing/completed 的成员 PATCH、
#     executing 删除、非 unsubmitted 提交等）
#   - PENDING_CAPACITY_FULL — 409：待执行席位已满
#   - SEAT_WINDOW_LOCKED — 409：席位窗口锁定（窗口内成员重排/移除受限）
#   - TASK_STATE_CONFLICT — 409：任务状态机冲突
#   - QUEUE_MEMBER_FLOOR — 409：移除成员低于下限（队列 PATCH 清空至 0、席位内移除最后成员）
#   - QUEUE_MEMBER_LOCKED — 409：队列成员内容锁定（未提交非回退 / 已提交 /
#     执行中 / 已完成队列成员不可编辑内容）
#   - TASK_EXECUTED_IMMUTABLE — 409：已执行成员不可移除（席位内）
#   - INPUT_PARSE_FAILED — 422：输入解析失败（提交核验顶层拒绝；导入 per-file reason 同名）
#   - INPUT_MULTISTEP_UNSUPPORTED — 422：多步任务（--Link1--）不支持（导入
#     per-file reason 与提交核验兜底同名）
#   - SETTING_VALUE_INVALID — 422：设置值越界/类型错（details.errors 保留逐项
#     reason，词表见下）
#   - SETTING_READONLY — 409：启动级只读设置不可改（任一失败项为 readonly 时整批 409）
#   - INVALID_MEMBERS — 422：创建队列时成员不存在或不在候选列表（M1 私有码补录，保留现名）
#   - TASK_IN_FLIGHT — 409：在途任务内容锁定（seat_task 形态编辑拒绝）
#   - TASK_FINISHED — 409：终态条目不可变（历史形态编辑拒绝）
#   - UPDATE_BLOCKED_RUNNING — 409：任务运行中禁止更新（仅 running 拦截；staged
#     随重启对账自然恢复，不拦截）
#   - UPDATE_IN_PROGRESS — 409：更新流程进行中重复触发，或流程进行中触发重启
#   - UPDATE_UNSUPPORTED — 409：源码运行形态不支持 WebUI 更新（提示走 git 更新）
#   - UPDATE_CHECK_FAILED — 502：探测远端最新版本失败（连接超时/DNS·连接失败/
#     HTTP 非 200，上游不可达语义；检查端点与 apply 同步预检共用）
#   - UPDATE_DOWNLOAD_FAILED — 502：apply 同步预检拉 .sha256 验下载通道失败
#     （不进异步；下载中段失败走 phase=failed 如实反馈，不经此码）
#   - ANALYSIS_UNAVAILABLE — 409：非 succeeded 条目请求分析，或 analysis.json
#     缺失且惰性重建失败（M3；重建 = finalize 急解析失败后端点首次访问补跑一次）
#   - ANALYSIS_PARSE_FAILED — 422：请求的分析块数据不足或解析超时（如无频率
#     任务请求 frequencies；workspace-out 解析超时 60s，details 注明 timeout；M3）
#   - WORKSPACE_PATH_OUTSIDE — 400：工作区 .out/.log 分析路径守卫失败（越出
#     工作区、路径为空、后缀不符三态同码。§2.3 路径守卫：resolve 后须为
#     workspace_root 子孙且后缀 ∈ {.out,.log}；M3）
#   - CUBE_GENERATION_FAILED — 502：cubegen 非零退出/超时 120s（details 携带
#     stderr 尾部；fchk 产物缺失亦走此码、details 注明；M3）
#   - CUBE_EXECUTABLE_MISSING — 503：g16_root/cubegen 探测失败（显式不静默；M3）
#
# 词表一：导入 per-file reason（files[].error 值域）
#   INVALID_FILENAME / UNSUPPORTED_EXTENSION / INVALID_ENCODING /
#   INPUT_PARSE_FAILED / INPUT_MULTISTEP_UNSUPPORTED
# 词表二：设置域逐项 reason（details.errors[].reason 值域）
#   unknown_setting / readonly / range / type
#
# 字段时机标注（roadmap §2.6）：C=创建必填、T=状态流转更新、F=终态补齐后冻结、
# O=可空。写入各 schema 的 description。

openapi: 3.0.3
info:
  title: G16 Web 工作台 API
  version: 2.1.0
  description: |
    面向 WSL2 单机的 Gaussian 计算化学工作台 REST API。
    覆盖六类页面：候选任务 / 队列 / 待执行 / 执行中 / 历史 / 设置。
    SSE 事件契约见同目录 sse.md；界面元素→端点映射见 mapping.md。

servers:
  - url: /api/v1
    description: 工作台后端（G16WEB_BIND_ADDR，默认 127.0.0.1）

# ============================= 安全（M0 无认证，绑回环即为安全边界）====

tags:
  - name: system
  - name: settings
  - name: candidates
  - name: queues
  - name: pending
  - name: executions
  - name: history
  - name: update
  - name: ui-prefs
  - name: storage

components:
  securitySchemes: {}

  schemas:
    # ---------------- 枚举全集 ----------------
    TaskState:
      type: string
      enum: [staged, running, succeeded, failed, skipped]
      description: 任务粒度状态机（roadmap §2.1）；acrchived 是历史条目标记非任务态
    QueueState:
      type: string
      enum: [unsubmitted, submitted, executing, completed]
      description: 队列四态；completed 为唯一稳定终态，失败自动回退为 unsubmitted
    QueueFinishReason:
      type: string
      enum: [success, abort_on_failure, finished_with_failures, manually_stopped]
      description: 队列最近一次执行结束原因
    CandidateOrigin:
      type: string
      enum: [imported, returned_unrun, returned_failed, returned_succeeded]
      description: 候选来源标记（roadmap §2.1 退回路径穷举）
    HistorySort:
      type: string
      enum: [submitted_desc, finished_desc, finished_asc, filename_asc, filename_desc]
      description: >-
        历史列表排序：submitted_desc 提交时间倒序（默认，id 逆序实现）；
        finished_desc / finished_asc 按完成时间（finished_at，终态统一存在）；
        filename_asc / filename_desc 按文件名自然序（不区分大小写、字母先于
        数字）。各排序并列时保持提交倒序（稳定排序），
        全量排序后分页，跨页全局有序。
    QueueSortKey:
      type: string
      enum: [default, name_asc, name_desc]
      description: >-
        队列页排序：default 默认序（回退置顶、组内创建时间倒序）；
        name_asc / name_desc 队列名称 zh-Hans-CN 字典序升/降序。
    UiPreferences:
      type: object
      description: 前端视图偏好（工作区 SQLite ui_prefs 表；键白名单与值域见 UiPreferencesUpdate）
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties:
            type: string
          description: 偏好键值（仅含已持久化键；值为所选排序枚举串）
    UiPreferencesUpdate:
      type: object
      description: PUT /ui-preferences 请求体（合并 upsert：只更新出现的键）
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties:
            type: string
          description: >-
            键白名单与值域：queues.sort ∈ QueueSortKey；history.sort 与
            archive.sort ∈ HistorySort（归档页与历史页同组件、键分立各自记忆）。
            未知键或越域值整批 400 INVALID_REQUEST。
    FailureCause:
      type: string
      enum: [manually_stopped, program_error, external_interrupt, predecessor_failed, queue_manually_stopped]
      description: 执行终态归因；succeeded 为 null
    SeatKind:
      type: string
      enum: [task, queue]
      description: 待执行席位类型
    EffectKind:
      type: string
      enum: [immediate, immediate_retroactive, new_submissions, on_restart]
      description: 设置项生效语义（m0-plan §2.2）；immediate_retroactive 仅席位上限

    # ---------------- 统一错误 ----------------
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE_CASE 错误码全集枚举（SSOT 载体见本文件头「错误码全集」清单，24 码 + 两张 reason 词表）
            message:
              type: string
            details:
              type: object
              nullable: true
              description: 错误附加信息（如越界值、逐字段错误数组）

    # ---------------- 分页信封 ----------------
    PageEnvelope:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            type: object
          description: 当前页数据（具体 schema 由各端点 response 覆盖）
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0

    # ---------------- 领域对象 ----------------
    Candidate:
      type: object
      description: 候选任务（创建即完整，此后不变；title 不落库，展示时实时解析）
      required: [id, filename, origin, failure_note, created_at]
      properties:
        id:
          type: integer
          description: "C；与后续 Task 同 id（跨形态延续，roadmap §2.6 ③）"
        filename:
          type: string
          description: "C；导入文件名（退回候选沿用任务文件名）"
        origin:
          $ref: '#/components/schemas/CandidateOrigin'
        failure_note:
          type: string
          nullable: true
          description: "C；仅 returned_failed：归因附注；其余 null"
        created_at:
          type: string
          format: date-time
          description: "C；补充字段提案"
        title:
          type: string
          nullable: true
          description: "—；响应中实时解析注入（解析失败为 null），不落库（roadmap §2.6 ①）"

    Task:
      type: object
      description: 任务（零自有属性，纯关系；无独立端点，作为嵌套表示）
      required: [id, position, time_limit_s, state]
      properties:
        id:
          type: integer
          description: "C；同候选 id"
        queue_id:
          type: string
          nullable: true
          description: "C/T；归属队列，直接提交者为 null"
        position:
          type: integer
          minimum: 0
          description: "T；队列内顺序（0 起）"
        time_limit_s:
          type: integer
          default: 0
          description: "C/T；墙钟上限，0=不限制；M0/M1 契约占位"
        state:
          $ref: '#/components/schemas/TaskState'
          description: "T；派生展示字段"

    Queue:
      type: object
      description: 队列（生命周期见 roadmap §2.1）
      required: [id, name, member_ids, skip_failed, state, rollback_flag, rollback_count, last_failure, finish_reason, created_at]
      properties:
        id:
          type: string
          description: "C；随机 6 位 base32（生成时对照全库查重）"
        name:
          type: string
          description: "C/T；默认 yyyymmddhhmmss 时间戳"
        member_ids:
          type: array
          items:
            type: integer
          description: "C/T；有序成员（创建校验 2–10；此后只减不增、≥1)"
        members:
          type: array
          description: "T；成员明细，与 member_ids 同序（队列页成员概览与编辑对话框的名称来源）——filename 取库行；title 实时解析不落库（同候选口径），文件缺失/解码失败/缺节为 null"
          items:
            type: object
            required: [task_id, filename, title]
            properties:
              task_id:
                type: integer
                description: "T；同 member_ids 对应位"
              filename:
                type: string
                description: "T；库行文件名"
              title:
                type: string
                nullable: true
                description: "T；实时解析，不落库"
        skip_failed:
          type: boolean
          description: "C/T；跳过失败任务开关"
        state:
          $ref: '#/components/schemas/QueueState'
        rollback_flag:
          type: boolean
          description: "T；失败回退标记"
        rollback_count:
          type: integer
          minimum: 0
          description: "T；回退次数，0 起"
        last_failure:
          type: object
          nullable: true
          description: "T；队列成功终态时清 null"
          properties:
            finish_reason:
              $ref: '#/components/schemas/QueueFinishReason'
            failure_positions:
              type: array
              items:
                type: integer
              description: 失败位置（任务 id）
            members:
              type: array
              items:
                type: object
                properties:
                  task_id:
                    type: integer
                  state:
                    $ref: '#/components/schemas/TaskState'
                  cause:
                    $ref: '#/components/schemas/FailureCause'
        finish_reason:
          # OpenAPI 3.0 兄弟键忽略原则：$ref 与 nullable 不能同级（allOf 包裹
          # openapi-core 亦不合并）；故内联枚举并显式含 null 表达可空。
          type: string
          enum: [success, abort_on_failure, finished_with_failures, manually_stopped, null]
          nullable: true
          description: "T；最近一次执行结束时写入；取值同 QueueFinishReason"
        created_at:
          type: string
          format: date-time
          description: "C；补充字段提案"
        updated_at:
          type: string
          format: date-time
          description: "T；补充字段提案"

    Resources:
      type: object
      description: "C；Link0 声明与补齐标记（roadmap §2.6）；defaulted=true 表示运行级缺省值补齐"
      required: [nproc, mem_gb]
      properties:
        nproc:
          type: object
          required: [value, defaulted]
          properties:
            value:
              type: integer
            defaulted:
              type: boolean
        mem_gb:
          type: object
          required: [value, defaulted]
          properties:
            value:
              type: number
            defaulted:
              type: boolean

    PendingSeat:
      type: object
      description: 待执行席位（get /pending 响应项）
      required: [seat_id, kind, position, members, locked, submitted_at]
      properties:
        seat_id:
          type: integer
          description: "C；席位标识（追加自增）"
        kind:
          $ref: '#/components/schemas/SeatKind'
        task_id:
          type: integer
          nullable: true
          description: "C；kind=task 时"
        queue_id:
          type: string
          nullable: true
          description: "C；kind=queue 时"
        queue_name:
          type: string
          nullable: true
          description: "C；kind=queue 时的队列名（实时取自队列）"
        submitted_at:
          type: string
          format: date-time
          description: "T；入席时刻即提交时刻（席位 created_at）"
        position:
          type: integer
          minimum: 0
          description: "T；席位顺序（0 起）"
        members:
          type: array
          items:
            type: object
            required: [task_id, filename, state]
            properties:
              task_id:
                type: integer
              filename:
                type: string
              state:
                $ref: '#/components/schemas/TaskState'
              position:
                type: integer
                minimum: 0
                nullable: true
                description: "T；队列内序号（0 起）；kind=task 席位为 null"
              title:
                type: string
                nullable: true
                description: "—；响应中实时解析注入（解析失败为 null），不落库（同候选 title 口径）"
              resources:
                $ref: '#/components/schemas/Resources'
          description: "T；队列席位成员概览（kind=task 为单元素）；title/resources 实时解析，输入文件不可读时 resources 键缺省"
        locked:
          type: boolean
          description: "T；并行窗口已触及 → 不可整席重排/移除"

    PendingResponse:
      type: object
      description: GET /pending 响应（席位 + 全局容量/窗口）
      required: [seats, capacity, window_size]
      properties:
        seats:
          type: array
          items:
            $ref: '#/components/schemas/PendingSeat'
        capacity:
          type: object
          required: [limit, occupied, available]
          properties:
            limit:
              type: integer
              description: 在途席位上限（运行级设置，默认 3）
            occupied:
              type: integer
            available:
              type: integer
        window_size:
          type: integer
          description: 当前并行执行数

    Execution:
      type: object
      description: 运行/已完成执行（运行视图；终态见 HistoryEntry）
      required: [id, task_id, queue_id, state, filename, submitted_at, input_hash, resources]
      properties:
        id:
          type: integer
          description: "C；派发时创建；run/<id>/ 派生"
        task_id:
          type: integer
          description: "C"
        queue_id:
          type: string
          nullable: true
          description: "C"
        state:
          $ref: '#/components/schemas/TaskState'
          description: 运行视图只出现 running（staged 由 /pending 表达）
        filename:
          type: string
          description: "C；冗余自任务，列表展示用"
        submitted_at:
          type: string
          format: date-time
          description: "C"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: "T；running 时补"
        input_hash:
          type: string
          nullable: true
          description: "C；sha256:<hex>，skipped 无（null）"
        resources:
          $ref: '#/components/schemas/Resources'
        hq_job_id:
          type: integer
          nullable: true
          description: "T；提交 HQ 后回填（M0 mock 给演示值）"
        monitor:
          type: object
          nullable: true
          description: "T；运行中实时（psutil）"
          properties:
            cpu_percent:
              type: number
            mem_rss_mb:
              type: number
            elapsed_s:
              type: number
        progress:
          type: object
          nullable: true
          description: "T；增量解析注入"
          properties:
            opt_step:
              type: integer
              nullable: true
            scf_cycle:
              type: integer
              nullable: true
            scf_round:
              type: integer
              nullable: true
              description: "T；第几次 SCF（Cycle 1 行出现即新一轮，自 1 递增）"
            converged:
              type: boolean
              nullable: true
            last_line:
              type: string
              nullable: true

    HistoryEntry:
      type: object
      description: 历史条目（终态冻结；Execution 超集 + 终态字段）
      allOf:
        - $ref: '#/components/schemas/Execution'
        - type: object
          required: [finished_at, cause, wall_time_s, chk_snapshot, archived, result_ref]
          properties:
            finished_at:
              type: string
              format: date-time
              description: "F"
            cause:
              # 同 Queue.finish_reason：$ref 与 nullable 不能同级，内联枚举显式含 null。
              type: string
              enum: [manually_stopped, program_error, external_interrupt, predecessor_failed, queue_manually_stopped, null]
              nullable: true
              description: "F；终态归因（同 FailureCause）；succeeded 为 null"
            wall_time_s:
              type: number
              description: "F；started_at→finished_at 派生"
            monitor_summary:
              type: object
              nullable: true
              description: "F；仅 succeeded"
              properties:
                cpu_peak_percent:
                  type: number
                mem_peak_mb:
                  type: number
                stall_alerts:
                  type: integer
                stall_total_minutes:
                  type: number
            chk_snapshot:
              type: object
              description: "F；非正常终止保全快照标记与位置"
              required: [protected, location]
              properties:
                protected:
                  type: boolean
                location:
                  type: string
                  nullable: true
                  description: 保护子目录位置；正常结束时 null
            archived:
              type: boolean
              description: "F→；冻结后唯一可变字段"
            result_ref:
              type: string
              nullable: true
              description: "M3 起：succeeded 且 run/<id>/analysis.json 落盘成功（含
                degraded 降级产物）时 = \"analysis.json\"（执行目录内相对引用，读取方
                按 run/<执行id>/ 拼接）；落盘失败/缺失恒 null。非 succeeded 恒 null
                （口径 m3-plan §2.1，2026-09-30 三轮审查统一）"

    HistoryExportRequest:
      type: object
      description: 批量导出请求（执行 id 集合；服务端去重保序）
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          description: 历史条目（终态执行）id 集合

    # ---------------- 分析域（M3 波 A1 增补，m3-plan §2.1/§2.3） ----------------
    Result:
      type: object
      description: 分析结果概览（仅 succeeded 执行；run/<id>/analysis.json 的契约
        形状，cclib 白名单解析产物。字段集一次定死，roadmap §2.6 规则 1/3）
      required: [state, parser, package, method, summary, blocks, missing,
        parse_error]
      properties:
        state:
          type: string
          enum: [parsed, degraded]
          description: degraded=至少一个请求块解析失败/缺失
        parser:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
            version:
              type: string
        package:
          type: object
          nullable: true
          description: cclib metadata（package/package_version）；不可得时 null
          required: [name, version]
          properties:
            name:
              type: string
            version:
              type: string
        method:
          type: string
          nullable: true
          description: metadata.methods 摘要（如 b3lyp/6-31g(d)）
        summary:
          type: object
          required: [natom, nmo, nbasis, scf_energy_eV, scf_energy_hartree,
            opt_converged, freq_count, imaginary_freq_count, homos]
          properties:
            natom:
              type: integer
            nmo:
              type: integer
            nbasis:
              type: integer
            scf_energy_eV:
              type: number
              nullable: true
              description: scfenergies 末值
            scf_energy_hartree:
              type: number
              nullable: true
              description: eV→hartree 换算单点（供能量表直接使用）
            opt_converged:
              type: boolean
              nullable: true
              description: optdone；非优化任务 null
            freq_count:
              type: integer
              nullable: true
              description: vibfreqs 长度；非频率任务 null
            imaginary_freq_count:
              type: integer
              nullable: true
            homos:
              type: array
              items:
                type: number
              description: HOMO 序号（开壳层 α/β 两值）
        blocks:
          $ref: '#/components/schemas/ResultBlocks'
        missing:
          type: array
          items:
            type: string
          description: degraded 时的缺失属性清单
        parse_error:
          type: string
          nullable: true
          description: 解析异常摘要（degraded 主因）

    ResultBlocks:
      type: object
      description: 可用分析块清单（驱动端点可见性与前端 tab 置灰；独立组件命名，
        避免与输入预览域 blocks 生成类名撞名）
      required: [convergence, frequencies, orbitals, thermochemistry]
      properties:
        convergence:
          type: boolean
        frequencies:
          type: boolean
        orbitals:
          type: boolean
        thermochemistry:
          type: boolean

    ConvergenceResponse:
      type: object
      description: 收敛数据（GET /history/{id}/analysis/convergence；单端点响应
        ≤2MB，超出按步均匀抽稀并置 downsampled=true）
      required: [downsampled, scf_trace, scf_targets, geo_trace, geo_targets,
        energy_series]
      properties:
        downsampled:
          type: boolean
        scf_trace:
          type: array
          description: 每几何步内各次 SCF 迭代的收敛判据列（cclib scfvalues 逐列展开）
          items:
            title: ScfTraceStep
            type: object
            required: [geometry_step, cycles]
            properties:
              geometry_step:
                type: integer
              cycles:
                type: array
                description: 每次迭代一行的判据值（列序同 scf_targets；个别判据
                  在迭代早期未更新时为 null——cclib scfvalues 实测含 NaN，
                  真机链路实证后随契约 diff 补 nullable，前端绘图按断点处理）
                items:
                  type: array
                  items:
                    type: number
                    nullable: true
        scf_targets:
          type: array
          items:
            type: number
          description: SCF 判据阈值（与 cycles 列同序）
        geo_trace:
          type: array
          description: 几何收敛判据逐几何步（优化任务；无则空数组）
          items:
            title: GeoTraceStep
            type: object
            required: [geometry_step, values]
            properties:
              geometry_step:
                type: integer
              values:
                type: array
                items:
                  type: number
        geo_targets:
          type: array
          items:
            type: number
        energy_series:
          type: array
          description: 各几何步末次 SCF 能量（scfenergies；hartree/eV 双单位）
          items:
            $ref: '#/components/schemas/EnergyPoint'

    EnergyPoint:
      type: object
      description: 能量序列单点（各几何步末次 SCF 能量，hartree/eV 双单位）
      required: [geometry_step, energy_eV, energy_hartree]
      properties:
        geometry_step:
          type: integer
        energy_eV:
          type: number
        energy_hartree:
          type: number

    FrequenciesResponse:
      type: object
      description: 频率表与红外强度（vibfreqs/vibirs/vibsyms/vibrmasses）
      required: [frequencies]
      properties:
        frequencies:
          type: array
          items:
            type: object
            required: [index, frequency_cm, ir_intensity, symmetry,
              reduced_mass, imaginary]
            properties:
              index:
                type: integer
              frequency_cm:
                type: number
                description: vibfreqs（1/cm）
              ir_intensity:
                type: number
                nullable: true
                description: vibirs（km/mol）
              symmetry:
                type: string
                nullable: true
                description: vibsyms；缺失时 null
              reduced_mass:
                type: number
                nullable: true
                description: vibrmasses
              imaginary:
                type: boolean
                description: 频率 < 0（虚频标红）

    OrbitalsResponse:
      type: object
      description: 轨道能量清单（不含 mocoeffs——系数不进响应，等值面走 cube 端点；
        输出无 MO 表时 blocks.orbitals=false，提示建议 Pop=Reg/Full）。开壳层
        任务 α/β 两组自旋各承载一份清单（spin 区分，各自 1..n 编号；B1 探针
        实证 phenoxyls 双自旋后随契约 diff 补录）
      required: [nmo, nbasis, homos, orbitals]
      properties:
        nmo:
          type: integer
          description: α 组轨道数（cubegen MO=<n> 上界校验基）
        nbasis:
          type: integer
        homos:
          type: array
          items:
            type: number
          description: HOMO 序号（闭壳层单值，开壳层 [α,β] 两值）
        orbitals:
          type: array
          items:
            type: object
            required: [index, energy_eV, symmetry, spin]
            properties:
              index:
                type: integer
                description: 同自旋组内 1 起（与 cubegen MO=<n> 同基；cube 生成
                  仅对 α 组，1≤n≤nmo）
              energy_eV:
                type: number
              symmetry:
                type: string
                nullable: true
                description: mosyms；缺失时 null（老版输出实测全缺）
              spin:
                type: string
                nullable: true
                description: 自旋组标记 alpha/beta；闭壳层 null（单组清单）

    WorkspaceOutAnalysis:
      type: object
      description: 工作区 .out/.log 只读分析一次性负载（四块合一，与分块端点同形
        嵌套；不落库、不写 result_ref；解析超时 60s 按 422 ANALYSIS_PARSE_FAILED）
      required: [overview, convergence, frequencies, orbitals]
      properties:
        overview:
          $ref: '#/components/schemas/Result'
        convergence:
          $ref: '#/components/schemas/ConvergenceResponse'
        frequencies:
          $ref: '#/components/schemas/FrequenciesResponse'
        orbitals:
          $ref: '#/components/schemas/OrbitalsResponse'

    CubeRequest:
      type: object
      description: cube 生成请求（kind 为类别名、服务端合成 cubegen 实参——
        MO=<orbital> 与 <kind>=SCF；幂等：同参数命中已生成文件直接返回）
      required: [kind]
      properties:
        kind:
          type: string
          enum: [MO, Potential, Density, Spin]
          description: 白名单外 422；MO 时 orbital 必填
        orbital:
          type: integer
          nullable: true
          description: kind=MO 必填且 1≤orbital≤nmo（越界 422）
        npts:
          type: integer
          nullable: true
          description: 40–120 整数（默认 80；越界 422）

    StorageUsage:
      type: object
      description: 空间占用统计（M3.7，只读；entries 按总占用降序、默认截断前
        50 条；纯拉取式无定时器，超阈仅警告不自动清理）
      required: [total_bytes, threshold_bytes, over, entries, total_entries, truncated]
      properties:
        total_bytes:
          type: integer
          description: 工作区根（G16WEB_HOME）整树 apparent size——run/ 产物树、
            数据库及 hq 状态、inputs 等全部内容计入（与 du -sb <工作区根> 同
            口径，并发落盘下允许条目竞态容差）；运行中执行目录与无历史行的
            孤儿目录一并计入；per-execution 明细仍按 run/<id> 分桶，桶外内容
            仅计入总量
        threshold_bytes:
          type: integer
          description: disk_usage_warn_gb 换算字节数；0=禁用告警
        over:
          type: boolean
          description: threshold_bytes>0 且 total_bytes≥threshold_bytes
        entries:
          type: array
          description: per-execution 占用明细（含运行中条目，reclaimable 恒 0；
            无历史行的孤儿目录仅计入 total_bytes、不产生明细）
          items:
            type: object
            required: [execution_id, task_id, filename, total_bytes, reclaimable_bytes]
            properties:
              execution_id:
                type: integer
              task_id:
                type: integer
              filename:
                type: string
              total_bytes:
                type: integer
              reclaimable_bytes:
                type: integer
                description: 可被手动清理入口移除的量（与 M1 清理边界判定同源单一实现；保全快照计 0）
        total_entries:
          type: integer
          description: 明细总数（截断前）
        truncated:
          type: boolean

    # ---------------- 输入分块结构 ----------------
    MoleculeSummary:
      type: object
      description: 分子说明节统计（Hill 记法元素统计）
      required: [atom_count, formula, variables_present, constants_present]
      properties:
        atom_count:
          type: integer
        formula:
          type: string
          description: Hill 记法，如 H2O1、C6H6O1（计数 1 显式）
        variables_present:
          type: boolean
        constants_present:
          type: boolean

    InputBlock:
      type: object
      description: 附加输入节（由 route 关键词触发）
      required: [lines, terminator_blank]
      properties:
        lines:
          type: array
          items:
            type: string
        terminator_blank:
          type: boolean
          description: 该节是否需要终止空行（以手册 Section Ordering 表逐节为准）

    InputPreview:
      type: object
      description: 分块预览（M0 预览与 M2 编辑共用；重组空行不变式见 m0-plan §2.2）
      required: [candidate_id, filename, blocks]
      properties:
        candidate_id:
          type: integer
        filename:
          type: string
        blocks:
          type: object
          required: [link0, route, title, charge_mult, molecule, additional_sections]
          properties:
            link0:
              type: object
              required: [lines, missing]
              properties:
                lines:
                  type: array
                  items:
                    type: string
                missing:
                  type: array
                  items:
                    type: string
                  description: 缺失 %NProcShared/%Mem 等（驱动提交确认框琥珀警告）
            route:
              type: string
            title:
              type: string
              nullable: true
            charge_mult:
              type: string
            molecule:
              $ref: '#/components/schemas/MoleculeSummary'
            additional_sections:
              type: array
              items:
                $ref: '#/components/schemas/InputBlock'
        parse_errors:
          type: array
          items:
            type: object
            required: [section, line, message]
            properties:
              section:
                type: string
              line:
                type: integer
              message:
                type: string
          description: 解析失败节信息（预览尽力而为；导入端点才严格校验）

    # ---------------- 设置 ----------------
    SettingItem:
      type: object
      description: 设置项（元数据供前端数据驱动渲染）
      required: [key, value, editable, effect]
      properties:
        key:
          type: string
        value:
          nullable: true
          anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          description: 实际值（scalar；类型由 value_type 决定）
        value_type:
          type: string
          enum: [string, integer, number, boolean]
        range:
          type: object
          nullable: true
          properties:
            min:
              type: number
              nullable: true
            max:
              type: number
              nullable: true
            enum:
              type: array
              nullable: true
              items:
                type: string
              description: 枚举值域（string 型参数载体，如 update_check_interval 的
                daily/weekly/monthly/never 四档）；非枚举参数缺省。校验不命中归
                type 类错误（不扩 reason 词表）
        editable:
          type: boolean
          description: false=启动级只读
        effect:
          $ref: '#/components/schemas/EffectKind'
        env_var:
          type: string
          nullable: true
          description: 启动级参数的环境变量名（G16WEB_ 前缀）
        description:
          type: string

    SettingsResponse:
      type: object
      description: GET/PUT /settings 响应（两级分组）。运行级参数含自动检查更新周期
        update_check_interval（string 四值枚举 daily/weekly/monthly/never，默认
        weekly，经 SettingItem.range.enum 表达，v2.1.0 起；凌晨 1:00 锚定、只发现不安装）
        与空间占用告警阈值 disk_usage_warn_gb（integer GB，0=禁用告警，默认 50
        ——A1 决策点 5 定稿；只读告警不涉执行语义、保存即生效，M3 波 A1 起——超阈仅
        警告不自动清理，m3-plan §2.6）
      required: [startup, runtime]
      properties:
        startup:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'
        runtime:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'

    SettingsUpdate:
      type: object
      description: PUT /settings 请求体（全有或全无；任一项校验失败整批拒绝）
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true

    # ---------------- 更新域（v2.1.0 功能更新） ----------------
    UpdatePhase:
      type: string
      enum: [idle, checking, available, up_to_date, downloading, installing, restarting, done, failed]
      description: 更新流程九相（与设置页更新卡显示状态机一一对应；available 即「发现新版本」）
    UpdateStatus:
      type: object
      description: 更新域状态对象（GET /update/status 与 check/apply/proxy 响应共用）
      required: [current_version, phase, proxy, supported]
      properties:
        current_version:
          type: string
          description: 当前版本（带 v 前缀形态，如 v2.1.0；与 /system/health version 同源）
        latest_version:
          type: string
          nullable: true
          description: 最近一次检查发现的远端版本（带 v 前缀）；从未检查成功过为 null
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次检查结束时刻（含失败；跨服务重启经部署目录 .update-check 恢复）
        phase:
          $ref: '#/components/schemas/UpdatePhase'
        message:
          type: string
          nullable: true
          description: 供前端逐字展示的当前状态/异常文案（§3.2/§3.5 文案表，全角标点）
        proxy:
          type: string
          nullable: true
          description: 代理通道（读自工作区 .update-proxy，与 update.sh 共用配置；null=直连；默认代理为 URL 串 https://v4.gh-proxy.org）
        supported:
          type: boolean
          description: 当前形态是否支持 WebUI 更新（部署目录存在 VERSION + bin/hq 布局；源码形态 false，前端「立即更新」置灰依据）
    UpdateProxyRequest:
      type: object
      description: PUT /update/proxy 请求体
      required: [proxy]
      properties:
        proxy:
          type: string
          nullable: true
          description: 代理 URL（null=直连；自定义值须为合法 URL，非法 400 INVALID_REQUEST）

    CandidateCreate:
      type: object
      description: POST /candidates 响应（导入，M1 实施；M0 mock）。M2 起含导入成队结果字段（queue_from_folder 时返回，见 POST /candidates）
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              filename:
                type: string
              duplicate:
                type: boolean
                description: 与既有候选同名且内容哈希一致的提示（不阻断导入，另行建目）
        queue:
          type: object
          nullable: true
          description: "M2；queue_from_folder=true 且成员数 2–10 成队时返回，回落（越界拒绝成队）为 null"
          properties:
            queue_id:
              type: string
            name:
              type: string
        queue_fallback_reason:
          type: string
          nullable: true
          description: "M2；越界拒绝成队回落全部候选时的回落原因（如「受支持文件 11 个，超出队列成员上限 10」），未回落为 null"

    SubmitResponse:
      type: object
      description: 提交响应（行内提交/队列提交/历史重新排队三端点共用）。M2 起提交前输入核验对输入副本执行换行规范化或空行规约时置 normalized=true
      required: [seat_id, task_id]
      properties:
        seat_id:
          type: integer
        task_id:
          type: integer
        normalized:
          type: boolean
          default: false
          description: "M2；本次提交核验对输入副本执行了 CRLF→LF 或空行规约变更（queue 提交逐成员核验，任一成员规范化即 true）；前端据此展示「已自动规范化」注记，不自行实现规约检测"

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    CandidateId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    QueueId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ExecutionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Error:
      description: 统一错误结构
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

# ============================= 端点 =============================

paths:
  /system/health:
    get:
      tags: [system]
      operationId: getSystemHealth
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime_s]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
                  uptime_s:
                    type: number
        default:
          $ref: '#/components/responses/Error'

  /system/restart:
    post:
      tags: [system]
      operationId: restartSystem
      summary: 触发服务重启（异步；危险操作需前端二次确认）
      description: >-
        受理后 detached 拉起重启脚本（先快照当前进程 cmdline/environ/cwd 与
        监听端口），服务 SIGTERM 优雅自退（不杀 HQ，§8.7：计算任务不受
        WebUI 重启影响），脚本等进程退出与端口释放后按快照原命令/环境/工作
        目录重新拉起并探活 /system/health；期间 SSE 断开由客户端看门狗重连。
        与更新流程互斥：进行中 409 UPDATE_IN_PROGRESS（复用既有码）。
        前端须二次确认且在存在运行中执行时改用长按确认（不新增错误码，
        运行中执行的分级确认属前端交互语义，后端不据此拦截）。
      responses:
        '202':
          description: 已受理（服务即将优雅重启）
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    enum: [restarting]
                  message:
                    type: string
        '409':
          description: 守卫拒绝（UPDATE_IN_PROGRESS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 读全部设置（两级分组）
      responses:
        '200':
          description: 设置全集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 批量写运行级设置（全有或全无）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新后全集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /update/status:
    get:
      tags: [update]
      operationId: getUpdateStatus
      summary: 最近检查结果与更新流程状态（页面恢复用）
      description: >-
        更新卡进入/刷新页面时拉取恢复，不触发重查。跨服务重启经部署目录两份伴生
        文件恢复：update-state（apply 流程标记；done/failed 恢复态被本端点消费后
        删除，下次成功检查兜底清理）与 .update-check（最近检查结果
        latest_version/last_checked_at，常驻不清理）。
      responses:
        '200':
          description: 状态对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'

  /update/check:
    post:
      tags: [update]
      operationId: checkUpdate
      summary: 触发一次检查（同步返回）
      description: >-
        探测远端 releases/latest/download/VERSION 附件（与 update.sh --check 同源，
        免 GitHub API 限流），语义化版本逐段比较（剥 v 前缀，仅严格更大算有更新）。
        自动检查（凌晨 1:00 锚定档期，运行级参数 update_check_interval）与本端点
        共用实现，只发现不安装。
      responses:
        '200':
          description: 检查结果状态对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '502':
          description: 探测失败（连接超时/无法连接/远端返回异常，UPDATE_CHECK_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /update/apply:
    post:
      tags: [update]
      operationId: applyUpdate
      summary: 触发更新（异步执行；三守卫 + 同步预检）
      description: >-
        守卫：存在 running 执行时 409 UPDATE_BLOCKED_RUNNING（仅 running 拦截，
        staged 随重启对账恢复）；流程进行中 409 UPDATE_IN_PROGRESS；源码形态
        409 UPDATE_UNSUPPORTED。已最新 200 幂等返回 phase=up_to_date（无更新不是
        错误）。有更新先同步预检：探测远端 VERSION 失败 → 502 UPDATE_CHECK_FAILED；
        拉 .sha256 验下载通道失败 → 502 UPDATE_DOWNLOAD_FAILED（预检失败均不进
        异步、不动任何文件）。预检通过 202 受理，下载/校验/替换/重启转后台执行，
        进度经 SSE update.progress/update.phase 推送。
      responses:
        '200':
          description: 已最新（幂等，phase=up_to_date）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '202':
          description: 已受理（更新流程后台执行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '409':
          description: 守卫拒绝（UPDATE_BLOCKED_RUNNING / UPDATE_IN_PROGRESS / UPDATE_UNSUPPORTED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: 同步预检失败（UPDATE_CHECK_FAILED / UPDATE_DOWNLOAD_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /update/proxy:
    put:
      tags: [update]
      operationId: setUpdateProxy
      summary: 设置代理通道（写工作区 .update-proxy，即时生效）
      description: >-
        与 update.sh 共用同一份工作区 .update-proxy 配置（URL 原文落盘且无尾
        换行；启动时自动从部署目录旧位置一次性搬迁）；null=直连。自定义值非法
        400 INVALID_REQUEST（既有码，不新增错误码）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProxyRequest'
      responses:
        '200':
          description: 设置后状态对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          description: 自定义代理 URL 非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /ui-preferences:
    get:
      tags: [ui-prefs]
      operationId: getUiPreferences
      summary: 读取前端视图偏好（列表排序规则等）
      description: >-
        返回已持久化的全部偏好键值（工作区 SQLite ui_prefs 表，跨重启/更新/
        断联不丢）；无记录键不在响应中，前端各自回落默认值。
      responses:
        '200':
          description: 偏好键值全量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiPreferences'
    put:
      tags: [ui-prefs]
      operationId: updateUiPreferences
      summary: 写入前端视图偏好（合并 upsert，整批校验）
      description: >-
        只更新请求体中出现的键（合并语义），返回合并后全量。键白名单与值域
        （queues.sort/history.sort/archive.sort）整批校验：任一未知键或越域值
        整批拒绝 400 INVALID_REQUEST（既有码，不新增错误码）。不发 SSE 事件
        （视图偏好为单浏览器态，不做跨标签页同步）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UiPreferencesUpdate'
      responses:
        '200':
          description: 合并后偏好键值全量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiPreferences'
        '400':
          description: 未知键或值越域（details.errors 逐项 key/reason）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: 分页列表（含实时 title）
      description: >-
        items 排序：回退候选（origin=returned_*）置顶、导入候选在后，两组内
        均按 created_at 倒序（最新在上），让回退条目一眼可见；同一秒导入的
        批内按 id 逆序（后导入在前）。排序唯一实现在取数端，切片前全量排序，
        跨页全局有序。
      parameters:
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CandidateOrigin'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 分页候选列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Candidate'
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags: [candidates]
      operationId: importCandidates
      summary: 导入（multipart，M1 实施；M0 mock）
      description: >-
        支持 files[]（批量）/ 文件夹导入 mode=files|folder。M2 增补导入成队：
        queue_from_folder=true 且 mode=folder 时，导入后以候选转换并创建队列
        （name=folder_name，受支持文件数 2–10 方可成队；越界拒绝成队、回落为
        全部生成候选并在 queue_fallback_reason 明示原因）。mode=files 时显式
        queue_from_folder=true → 422。成队事件序列：candidates.changed(created)
        ×N → candidates.changed(moved_out) ×N → queues.changed(created)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                mode:
                  type: string
                  enum: [files, folder]
                  default: files
                queue_from_folder:
                  type: boolean
                  default: false
                  description: "M2；导入后以文件夹名为队列名保存为队列（仅 mode=folder 有效）"
                folder_name:
                  type: string
                  description: "M2；队列名来源（queue_from_folder=true 时必填——浏览器 webkitdirectory 上传仅携文件基名，相对路径由前端另送）"
      responses:
        '201':
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCreate'
        '422':
          $ref: '#/components/responses/Error'

