  /workflows/{id}:
    get:
      tags: [workflow]
      operationId: getWorkflow
      summary: 组合流单点（状态 + 能量表跨容器后端聚合）
      description: >-
        C7 进度面板数据源：state 供进度展示（crest 执行与精修队列经既有 SSE
        事件驱动前端刷新后再拉本端点）；energy_summary 由后端聚合 crest 行
        （ensemble 相对能量）+ 精修队列行（末次 SCF 双单位能量），零点=聚合
        范围内最低能量。精修队列被删除/放弃时停留 refining、队列行按缺失成员
        处理、crest 结果仍可查。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 组合流记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/Error'

  /combo-templates:
    get:
      tags: [combo-templates]
      operationId: getComboTemplates
      summary: 读取组合流精修模板（5 套方案全量 + 初始值）
      description: >-
        组合流精修模板配置读取（插波 3.2.0）：5 套方案恒存在，按 template_id
        升序返回；initial.route 为前端「route 清空恢复初始值」来源。无副作用、
        不发 SSE 事件（对话框打开时拉取，ui-preferences 同口径）。
      responses:
        '200':
          description: 模板全量与初始值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboTemplatesResponse'

  /combo-templates/{templateId}:
    put:
      tags: [combo-templates]
      operationId: updateComboTemplate
      summary: 保存组合流精修模板（全量替换；校验→归一化→落库）
      description: >-
        全量替换语义：未携带/空值字段按规则恢复（name/route 恢复初始值、
        link0 三字段置 null=未配置），不做部分更新。校验一次性全量执行、
        errors 全量返回：任一失败 422 VALIDATION_FAILED（details.errors[]
        reason 值域见文件头词表三；enforce 模式词典外 token 以
        reason=keyword_not_in_dict 条目回传、message 含 token 原文，前端据该
        reason 渲染「忽略拼写警告并保存」豁免按钮，ignore_spelling=true 时
        该批 token 放行）。校验通过则 casefold 归一化（含 freq 自动补
        temperature=298.15）落库，200 返回更新后条目 + notice。404=
        templateId ∉ {1..5}。并发取舍：单机单用户场景不设并发/乐观锁控制
        （updated_at 仅审计）；不发 SSE 事件（ui-preferences 同口径）。
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComboTemplateUpdate'
      responses:
        '200':
          description: 更新后条目（含 notice）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboTemplateMutationResult'
        '404':
          description: templateId 不在 1–5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 校验失败（details.errors 全量，词表三 reason 值域）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /events:
    get:
      tags: [system]
      operationId: sseEvents
      summary: SSE 事件流（契约见 sse.md）
      responses:
        '200':
          description: SSE 流
          headers:
            Content-Type:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string