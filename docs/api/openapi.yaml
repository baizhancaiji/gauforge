        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                time_limit_s:
                  type: integer
                  default: 0
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200':
          description: 已入待执行队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /queues:
    get:
      tags: [queues]
      operationId: listQueues
      summary: 队列列表
      responses:
        '200':
          description: 队列列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Queue'
    post:
      tags: [queues]
      operationId: createQueue
      summary: 创建队列（成员 2–10 校验，M2 实施；M0 mock）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, member_ids, skip_failed]
              properties:
                name:
                  type: string
                member_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 2
                  maxItems: 10
                skip_failed:
                  type: boolean
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '422':
          $ref: '#/components/responses/Error'

  /queues/{id}:
    get:
      tags: [queues]
      operationId: getQueue
      summary: 队列详情（含成员概览与失败记录）
      parameters:
        - $ref: '#/components/parameters/QueueId'
      responses:
        '200':
          description: 队列详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [queues]
      operationId: updateQueue
      summary: 更新 {name?/member_ids?/skip_failed?}（全量有序、原子，M2 实施）
      parameters:
        - $ref: '#/components/parameters/QueueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                member_ids:
                  type: array
                  items:
                    type: integer
                skip_failed:
                  type: boolean
      responses:
        '200':
          description: 更新后队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [queues]
      operationId: deleteQueue
      summary: 删除队列（二次确认在前端）
      parameters:
        - $ref: '#/components/parameters/QueueId'
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /queues/{id}/submit:
    post:
      tags: [queues]
      operationId: submitQueue
      summary: 直接提交（保存并进入执行，M2 实施）
      parameters:
        - $ref: '#/components/parameters/QueueId'
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /pending:
