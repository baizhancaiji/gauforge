  /workflows/conformer-refinement:
    post:
      tags: [workflow]
      operationId: submitConformerRefinement
      summary: 一键组合流提交（crest 构象搜索 → top-N 精修队列自动生成与提交）
      description: >-
        M4 组合流（M4.2/M4.5「一个按钮」验收语义的端点承载）。流程：生成 crest
        任务（候选输入副本的分子坐标引导文件，程序化生成）→ 入待执行队列（占
        1 席）→ 登记 workflow 记录 → crest succeeded 终态钩子提取 ensemble 与
        构象能量表（锁 crest 3.0.2 实测格式的最小提取器）→ top-N 构象坐标对
        模板做分子说明节坐标替换程序化生成 N 个 g16 成员输入 → 生成精修队列
        （成员数 N=min(top_n, 实际构象数)）→ 自动提交。自动提交满员时精修队列
        保留为已保存（unsubmitted）+ workflow.refine_queue_pending=true（前端
        提示手动提交）；crest 阶段失败或 ensemble 构象数 <2 → workflow 记
        failed、不生成精修队列。前置检查顺序（m4-plan §2.3）：可执行探测
        （503）→ 席位满员（409，整体拒绝零副作用）→ 候选形态（422）→ top_n
        越界（422）。crest 任务 kind=crest：不入 cclib 管道、无增量进度解析
        与停滞告警（sse.md 两事件行补注）、禁入任何队列成员。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConformerRefinementRequest'
      responses:
        '200':
          description: 已受理（crest 任务已入待执行队列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConformerRefinementResponse'
        '409':
          description: 在途席位满员（PENDING_CAPACITY_FULL，零副作用）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 来源候选形态（WORKFLOW_STATE_INVALID）/ top_n 越界（VALIDATION_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: crest/xtb 可执行探测失败（CREST_EXECUTABLE_MISSING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /workflows:
    get:
      tags: [workflow]
      operationId: listWorkflows
      summary: 组合流列表（按 updated_at 倒序；页面刷新恢复路径）
      parameters:
        - name: limit
          in: query
          required: false
          schema:
